  .msg-u{background:#1e40af;color:#fff;border-radius:12px;border-top-right-radius:2px;padding:10px 14px;max-width:88%;font-size:13px;margin-left:auto;line-height:1.55}

  @media print{aside,header,.no-print{display:none!important}main{overflow:visible!important}}

<div id="app" class="flex h-screen overflow-hidden">

<script>
/* ============================================================
   AVCİBEY İNŞAAT MAKİNALARI ERP — Tek Dosya Uygulama
   Kalıcı Depolama: IndexedDB (Dexie)
============================================================ */

// ---------- 0. YARDIMCILAR ----------
const $=s=>document.querySelector(s);
const el=$;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const round2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const round1=n=>Math.round((+n+Number.EPSILON)*10)/10;
const pad5=n=>String(n).padStart(5,'0');
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const NF=new Intl.NumberFormat('tr-TR');
const MF=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'});
const fmtNum=v=>v==null||v===''?'—':NF.format(+v);
const fmtMoney=v=>MF.format(+v||0);
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':b>1024?(b/1024).toFixed(0)+' KB':b+' B';
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayISO(){return toISO(new Date());}
function fmtDate(iso){if(!iso)return '—';const p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:iso;}
function addDaysISO(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return toISO(d);}
function monthKey(offset){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYLAR_K=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function monthStart(ym){return ym+'-01';}
function monthEnd(ym){const d=new Date(ym+'-01T00:00:00');d.setMonth(d.getMonth()+1);d.setDate(0);return toISO(d);}
function download(name,content,mime='text/plain'){const b=content instanceof Blob?content:new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function blobToDataURL(b){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}
async function dataURLtoBlob(u){const r=await fetch(u);return r.blob();}

// ---------- 1. VERİTABANI ----------
const db=new Dexie('AvcibeyERP');
db.version(1).stores({
  cariler:'++id, kod, unvan, tip',
  cariHareketler:'++id, cariId, tarih, refId',
  araclar:'++id, plaka',
  malzemeler:'++id, ad',
  personel:'++id, adSoyad, durum',
  kantar:'++id, fisNo, tarih, cariId, aracId, malzemeId',
  yakit:'++id, tarih, aracId',
  tesis:'++id, tarih',
  irsaliye:'++id, irsaliyeNo, tarih, cariId',
  sevk:'++id, sevkNo, tarih, cariId',
  fatura:'++id, faturaNo, tarih, cariId, tip, durum, vadeTarihi',
  gelirGider:'++id, tarih, tip, kategori',
  kasa:'++id, tarih, tip, refId',
  sanayi:'++id, tarih, kategori',
  puantaj:'++id, tarih, aracId, soforId',
  mesai:'++id, tarih, personelId',
  kdvKayit:'++id, ym',
  sozlesme:'++id, sozlesmeNo, cariId, durum',
  belgeler:'++id, [modul+kayitId], modul',
  sayac:'key',
  ayarlar:'key'
});

// ---------- 2. LOOKUP (Küçük ana tablolar) ----------
const LK={cariler:new Map(),araclar:new Map(),malzemeler:new Map(),personel:new Map()};
const LABEL_KEY={cariler:'unvan',araclar:'plaka',malzemeler:'ad',personel:'adSoyad'};
async function refreshLookups(){
  for(const t of ['cariler','araclar','malzemeler','personel']){
    const rows=await db.table(t).toArray();LK[t]=new Map(rows.map(r=>[r.id,r]));
  }
}
const rawLabel=(t,row)=>row?(row[LABEL_KEY[t]]??''):'';
const labelOf=(t,row)=>row?esc(rawLabel(t,row)):'<span class="text-slate-300">—</span>';
const lkLabel=(t,id)=>labelOf(t,LK[t].get(id));

// ---------- 3. Sayaç / Numara ----------
async function nextNo(prefix){
  return db.transaction('rw',db.sayac,async()=>{
    const row=(await db.sayac.get(prefix))||{key:prefix,value:0};
    row.value++;await db.sayac.put(row);
    return prefix+'-'+pad5(row.value);
  });
}

// ---------- 4. SEED (İlk kurulum verisi) ----------
async function seedIfEmpty(){
  if((await db.cariler.count())>0)return;
  const malzSeed=[
    {ad:'Mıcır 0-5 mm',birim:'ton',birimFiyat:120},{ad:'Mıcır 5-12 mm',birim:'ton',birimFiyat:145},
    {ad:'Mıcır 12-22 mm',birim:'ton',birimFiyat:150},{ad:'Mıcır 22-31,5 mm',birim:'ton',birimFiyat:140},
    {ad:'Yıkanmış Kum',birim:'ton',birimFiyat:130},{ad:'Stabilize Dolgu',birim:'ton',birimFiyat:110},
    {ad:'Taş Tozu',birim:'ton',birimFiyat:90},{ad:'By-Pass',birim:'ton',birimFiyat:60}];
  const aracSeed=[
    {plaka:'06 AVB 101',tip:'Kamyon',marka:'Mercedes Axor 3340',yil:2019,durum:'Aktif'},
    {plaka:'06 AVB 102',tip:'Kamyon',marka:'Volvo FMX 460',yil:2021,durum:'Aktif'},
    {plaka:'06 AVB 103',tip:'Kamyon',marka:'MAN TGS 33.430',yil:2020,durum:'Aktif'},
    {plaka:'06 AVB 104',tip:'Kamyon',marka:'Ford Cargo 3542',yil:2018,durum:'Aktif'},
    {plaka:'İM-01',tip:'Lastikli Yükleyici',marka:'CAT 966H',yil:2017,durum:'Aktif'},
    {plaka:'İM-02',tip:'Ekskavatör',marka:'Hitachi ZX350',yil:2019,durum:'Aktif'},
    {plaka:'İM-03',tip:'Konkasör',marka:'General Makina 150 T/S',yil:2016,durum:'Aktif'},
    {plaka:'06 AVB 210',tip:'Kamyonet',marka:'Ford Transit',yil:2022,durum:'Aktif'}];
  const persSeed=[
    {adSoyad:'Ramazan Kılıç',gorev:'Saha Formeni',maas:42000},{adSoyad:'Hüseyin Avcı',gorev:'Operatör',maas:36000},
    {adSoyad:'Kadir Yıldırım',gorev:'Operatör',maas:35500},{adSoyad:'Mustafa Demirel',gorev:'Şoför',maas:33000},
    {adSoyad:'İbrahim Şen',gorev:'Şoför',maas:33000},{adSoyad:'Osman Polat',gorev:'Şoför',maas:32500},
    {adSoyad:'Yusuf Er',gorev:'Şoför',maas:32500},{adSoyad:'Emine Koçak',gorev:'Kantar Memuru',maas:28000},
    {adSoyad:'Serkan Uslu',gorev:'Bakım Teknisyeni',maas:34000},{adSoyad:'Ayşe Türk',gorev:'Muhasebeci',maas:38000}
  ].map(p=>({...p,tcNo:String(randInt(10000000000,99999999999)),telefon:'05'+randInt(30,55)+' '+randInt(100,999)+' '+randInt(10,99)+' '+randInt(10,99),iseGiris:addDaysISO(todayISO(),-randInt(200,2200)),durum:'Aktif',adres:'',not:''}));
  const cariSeed=[
    {unvan:'Yıldız Yapı A.Ş.',tip:'Müşteri',telefon:'0312 397 11 22',yetkili:'Murat Yıldız'},
    {unvan:'Anadolu Beton San. Tic. Ltd. Şti.',tip:'Müşteri',telefon:'0312 394 55 60',yetkili:'Selim Anadolu'},
    {unvan:'Mega İnşaat Taahhüt A.Ş.',tip:'Müşteri',telefon:'0312 441 20 30',yetkili:'Kerem Mega'},
    {unvan:'Doğuş Hafriyat Ltd. Şti.',tip:'Müşteri',telefon:'0532 410 22 11',yetkili:'Tamer Doğuş'},
    {unvan:'Başkent Yol Yapı A.Ş.',tip:'Müşteri',telefon:'0312 289 74 10',yetkili:'Orhan Başkent'},
    {unvan:'Güven Hazır Beton A.Ş.',tip:'Müşteri',telefon:'0312 397 88 90',yetkili:'Seda Güven'},
    {unvan:'Toros İnşaat ve Tic. Ltd.',tip:'Müşteri',telefon:'0533 622 41 90',yetkili:'Veysel Toros'},
    {unvan:'Ankara Akaryakıt Dağıtım A.Ş.',tip:'Tedarikçi',telefon:'0312 590 10 10',yetkili:'Filiz Akar'},
    {unvan:'Aydınlar Yedek Parça San.',tip:'Tedarikçi',telefon:'0312 397 66 12',yetkili:'Nuri Aydın'},
    {unvan:'Bereket Lastik Ticaret',tip:'Tedarikçi',telefon:'0312 278 33 45',yetkili:'Rıza Bereket'},
    {unvan:'Anadolu Patlayıcı Madde A.Ş.',tip:'Tedarikçi',telefon:'0312 815 20 70',yetkili:'Cem Anadolu'}
  ].map((c,i)=>({kod:'CR-'+pad5(i+1),vergiNo:String(randInt(1000000000,9999999999)),email:'',adres:'Ankara',not:'',bakiye:0,...c}));

  const malzIds=await db.malzemeler.bulkAdd(malzSeed,{allKeys:true});
  const aracIds=await db.araclar.bulkAdd(aracSeed,{allKeys:true});
  const persIds=await db.personel.bulkAdd(persSeed,{allKeys:true});
  const cariIds=await db.cariler.bulkAdd(cariSeed,{allKeys:true});
  const kamyonIds=aracIds.slice(0,4), makineIds=aracIds.slice(4,7);
  const musteriIds=cariIds.filter((_,i)=>cariSeed[i].tip==='Müşteri');
  const soforNames=persSeed.filter(p=>p.gorev==='Şoför').map(p=>p.adSoyad);
  const opNames=persSeed.filter(p=>p.gorev==='Operatör').map(p=>p.adSoyad);
  const opPersIds=persIds.filter((_,i)=>['Operatör','Şoför'].includes(persSeed[i].gorev));

  const K=[],Y=[],T=[],P=[],ME=[],GG=[],SN=[],IR=[],SV=[];
  let kg=0,ir=0,sv=0;
  const kcm={}; const yakitMonth={}; const sanayiMonth={};
  const now=new Date();
  for(let i=150;i>=1;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    if(d.getDay()===0)continue;
    const iso=toISO(d),ym=iso.slice(0,7);
    const cal=round1(rand(7,10.5)),dur=round1(rand(0,2));
    T.push({tarih:iso,vardiya:'Gündüz',baslama:'07:00',bitis:'18:00',calismaSaati:round1(Math.max(0,cal-dur)),durusSaati:dur,durusNedeni:dur>0.8?pick(['Arıza','Bakım','Elektrik Kesintisi','Malzeme Bekleme']):'',uretimTon:randInt(450,1350),operator:pick(opNames),not:''});
    const n=randInt(5,11);
    for(let k=0;k<n;k++){
      const mi=randInt(0,malzSeed.length-1),m=malzSeed[mi];
      const dara=randInt(11000,15200),net=randInt(9000,26800);
      const tutar=round2(net/1000*m.birimFiyat);
      const cid=pick(musteriIds);
      K.push({fisNo:'KG-'+pad5(++kg),tarih:iso,cariId:cid,aracId:pick(kamyonIds),malzemeId:malzIds[mi],brut:dara+net,dara,net,birimFiyat:m.birimFiyat,tutar,sofor:pick(soforNames),not:''});
      const key=cid+'|'+ym;if(!kcm[key])kcm[key]=0;kcm[key]+=tutar;
    }
    if(Math.random()<0.7){const nn=randInt(2,4);
      for(let k=0;k<nn;k++){const mi=randInt(0,malzSeed.length-1);
        IR.push({irsaliyeNo:'IR-'+pad5(++ir),tarih:iso,cariId:pick(musteriIds),aracId:pick(kamyonIds),malzemeId:malzIds[mi],miktar:randInt(10,27),birim:'ton',aciklama:''});
        SV.push({sevkNo:'SV-'+pad5(++sv),tarih:iso,cariId:pick(musteriIds),santiye:pick(['Merkez Şantiye','Otogar Projesi','Kuzey Yolu İkmal','Havaalanı Bağlantı Yolu','OSB Altyapı']),aracId:pick(kamyonIds),malzemeId:malzIds[mi],tonaj:randInt(10,27),sofor:pick(soforNames),not:''});
      }}
    const yn=randInt(1,3);
    for(let k=0;k<yn;k++){const litre=randInt(90,380),bf=round2(rand(40.5,43.5)),tt=round2(litre*bf);
      Y.push({tarih:iso,aracId:pick(aracIds.slice(0,7)),litre,birimFiyat:bf,tutar:tt,istasyon:pick(['Merkez İstasyon','Sanayi Petrol','Yol Kenarı Petrol']),fisNo:'YF-'+randInt(10000,99999),not:''});
      yakitMonth[ym]=(yakitMonth[ym]||0)+tt;}
    aracIds.slice(0,7).forEach(aid=>{const kamyon=kamyonIds.includes(aid);
      P.push({tarih:iso,aracId:aid,soforId:pick(opPersIds),vardiya:'Gündüz',calismaSaati:round1(rand(6,10)),km:kamyon?randInt(120,380):0,not:''});});
    if(Math.random()<0.35){const tut=round2(rand(1500,28000));
      SN.push({tarih:iso,kategori:pick(['Yedek Parça','Bakım-Onarım','Lastik','Yağ-Madeni Yağ','Kaynak-Elektrot','İş Güvenliği']),tedarikci:pick(['Aydınlar Yedek Parça','Bereket Lastik','Sanayi Çarşısı']),fisNo:'SF-'+randInt(1000,9999),tutar:tut,aciklama:''});
      sanayiMonth[ym]=(sanayiMonth[ym]||0)+tut;}
  }
  persIds.forEach((pid,ix)=>{const p=persSeed[ix];
    for(let i=147;i>=1;i-=7){const d=new Date(now);d.setDate(d.getDate()-i);if(d.getDay()===0)continue;
      const fs=randInt(0,12);if(fs===0)continue;const su=round2(p.maas/225*1.5);
      ME.push({tarih:toISO(d),personelId:pid,normalSaat:8,fazlaSaat:fs,saatUcreti:su,toplam:round2(fs*su),aciklama:''});}});
  await db.kantar.bulkAdd(K);await db.yakit.bulkAdd(Y);await db.tesis.bulkAdd(T);
  await db.puantaj.bulkAdd(P);await db.mesai.bulkAdd(ME);await db.irsaliye.bulkAdd(IR);await db.sevk.bulkAdd(SV);
  await db.sanayi.bulkAdd(SN);

  const F=[];let ft=0;const curYM=todayISO().slice(0,7);
  for(const key in kcm){const [cid,ym]=key.split('|');const tutar=round2(kcm[key]);
    if(tutar<1000)continue;
    const kdv=round2(tutar*0.2),gt=round2(tutar+kdv);
    const paid=ym<curYM?Math.random()<0.85:Math.random()<0.3;
    F.push({faturaNo:'FT-'+pad5(++ft),tarih:ym+'-28',cariId:+cid,tip:'Satış',araToplam:tutar,kdvOrani:20,kdvTutar:kdv,genelToplam:gt,odeme:'Vadeli',vadeTarihi:addDaysISO(ym+'-28',30),durum:paid?'Ödendi':'Ödenmedi',aciklama:ym+' dönemi mıcır satışı'});
  }
  for(const ym in yakitMonth){const tutar=round2(yakitMonth[ym]);const kdv=round2(tutar*0.2);

// ---------- 7. UI PRİMİTİFLERİ ----------
let modalStack=[];
function openModal(html,{w='640px'}={}){
  const ov=document.createElement('div');
  ov.className='fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50';
  ov.innerHTML=`<div class="bg-white rounded-xl shadow-2xl w-full flex flex-col max-h-[92vh]" style="max-width:${w}">${html}</div>`;
  $('#modal-root').appendChild(ov);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal(ov);});
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(ov));
  modalStack.push(ov);return ov;
}
function closeModal(ov){ov=ov||modalStack[modalStack.length-1];if(!ov)return;ov.remove();modalStack=modalStack.filter(x=>x!==ov);}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)closeModal();});
function confirmDlg(msg){return new Promise(res=>{
  const ov=openModal(`<div class="p-5">
    <div class="flex items-start gap-3">
      <div class="w-9 h-9 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">${icon('alert','w-5 h-5')}</div>
      <div><div class="font-semibold text-slate-800 mb-1">Onay Gerekli</div><div class="text-[13px] text-slate-500">${esc(msg)}</div></div>
    </div>
    <div class="flex justify-end gap-2 mt-5"><button class="btn btn-ghost" data-no>Vazgeç</button><button class="btn btn-danger" data-yes>Evet, Onayla</button></div></div>`,{w:'430px'});
  ov.querySelector('[data-no]').onclick=()=>{closeModal(ov);res(false);};
  ov.querySelector('[data-yes]').onclick=()=>{closeModal(ov);res(true);};
});}
function toast(msg,type='success'){
  const colors={success:'bg-slate-900',error:'bg-red-600',info:'bg-blue-700'};
  const t=document.createElement('div');
  t.className=colors[type]+' text-white text-[13px] px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 animate-slide';
  t.innerHTML=icon(type==='error'?'alert':'check','w-4 h-4')+' '+esc(msg);
  $('#toast-root').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2800);
}

async function bumpBakiye(cariId,delta){const c=await db.cariler.get(cariId);if(c){c.bakiye=round2((c.bakiye||0)+delta);await db.cariler.put(c);await refreshLookups();}}
async function addCariHareket(h){await db.cariHareketler.add(h);await bumpBakiye(h.cariId,h.tip==='Borç'?h.tutar:-h.tutar);}
async function unlinkHareketler(refId){const hs=await db.cariHareketler.where('refId').equals(refId).toArray();for(const h of hs){await db.cariHareketler.delete(h.id);await bumpBakiye(h.cariId,h.tip==='Borç'?-h.tutar:h.tutar);}}
async function kasaBakiye(){let g=0,c=0;await db.kasa.each(k=>{if(k.tip==='Giriş')g+=+k.tutar||0;else c+=+k.tutar||0;});return{g:round2(g),c:round2(c),b:round2(g-c)};}
async function aggMonth(table,ym,field,cond){let s=0,c=0;await db.table(table).where('tarih').startsWith(ym).each(r=>{if(!cond||cond(r)){s+=+r[field]||0;c++;}});return{s:round2(s),c};}

function tesisCalc(b1,b2,durus){if(!b1||!b2)return 0;let[a,c]=b1.split(':').map(Number),[b,d]=b2.split(':').map(Number);let m=(b*60+d)-(a*60+c);if(m<0)m+=1440;return round1(Math.max(0,m/60-(+durus||0)));}

function filterHtml(f,s){
  if(f.type==='ref'){const opts=[...LK[f.table].values()].sort((a,b)=>rawLabel(f.table,a).localeCompare(rawLabel(f.table,b),'tr'));
    return `<select class="inp !w-44" data-f="${f.name}"><option value="">${f.label}: Tümü</option>${opts.map(o=>`<option value="${o.id}" ${String(s.filters[f.name])===String(o.id)?'selected':''}>${esc(rawLabel(f.table,o))}</option>`).join('')}</select>`;}
  if(f.type==='select')return `<select class="inp !w-36" data-f="${f.name}"><option value="">${f.label}: Tümü</option>${f.options.map(o=>`<option value="${o}" ${String(s.filters[f.name])===String(o)?'selected':''}>${o}</option>`).join('')}</select>`;
  if(f.type==='dateRange')return `<input type="date" class="inp !w-36" data-f="${f.name}_from" value="${s.filters[f.name+'_from']||''}"><span class="text-slate-400 text-xs">—</span><input type="date" class="inp !w-36" data-f="${f.name}_to" value="${s.filters[f.name+'_to']||''}">`;
  return '';
}
function cellVal(c,r){
  if(c.render)return c.render(r);
  let v=c.ref?lkLabel(c.ref[1],r[c.ref[0]]):r[c.key];
  if(!c.ref&&(v==null||v===''))return '<span class="text-slate-300">—</span>';
  switch(c.fmt){case 'date':return fmtDate(v);case 'money':return fmtMoney(v);case 'num':return fmtNum(v);case 'badge':return badge(v);default:return c.ref?v:esc(v);}
}
function rowHtml(mod,r){
  return `<tr class="border-t border-slate-100 hover:bg-slate-50" data-id="${r.id}">
    ${mod.columns.map(c=>`<td class="${c.align==='r'?'tr':''} ${c.bold?'font-semibold text-slate-800':''}">${cellVal(c,r)}</td>`).join('')}
    <td class="tr whitespace-nowrap">
      ${mod.rowActions?mod.rowActions(r):''}
      <button class="btn-icon" data-act="docs" title="Belgeler (PDF)">${icon('paperclip','w-4 h-4')}</button>
      <button class="btn-icon" data-act="edit" title="Düzenle">${icon('pencil','w-4 h-4')}</button>
      <button class="btn-icon hover:!text-red-600" data-act="del" title="Sil">${icon('trash','w-4 h-4')}</button>
    </td></tr>`;
}
async function loadRows(mod){
  const s=S(mod.id),tbody=$('#rows');if(!tbody)return;
  let coll=db.table(mod.table).orderBy('id').reverse();
  const q=s.q.trim().toLowerCase();
  coll=coll.filter(r=>{
    if(q){let hit=(mod.searchFields||[]).some(k=>String(r[k]??'').toLowerCase().includes(q));
      if(!hit&&mod.searchRefs)for(const k in mod.searchRefs){const row=LK[mod.searchRefs[k]].get(r[k]);if(row&&rawLabel(mod.searchRefs[k],row).toLowerCase().includes(q)){hit=true;break;}}
      if(!hit)return false;}
    for(const f of(mod.filters||[])){
      if(f.type==='dateRange'){const a=s.filters[f.name+'_from'],b=s.filters[f.name+'_to'];
        if(a&&String(r[f.name])<a)return false;if(b&&String(r[f.name])>b)return false;}
      else{const v=s.filters[f.name];if(v!==undefined&&v!==''&&v!==null&&String(r[f.name])!==String(v))return false;}}
    return true;});
  const total=await coll.count();
  const pages=Math.max(1,Math.ceil(total/s.size));if(s.page>pages)s.page=pages;
  const rows=await coll.offset((s.page-1)*s.size).limit(s.size).toArray();
  tbody.innerHTML=rows.length?rows.map(r=>rowHtml(mod,r)).join(''):`<tr><td colspan="99" class="text-center py-10 text-slate-400">Kayıt bulunamadı</td></tr>`;
  renderPager(mod,total);
}
function renderPager(mod,total){
  const s=S(mod.id),pages=Math.max(1,Math.ceil(total/s.size)),p=s.page,pg=$('#pager');if(!pg)return;
  let html=`<span>Toplam <b class="text-slate-700">${fmtNum(total)}</b> kayıt • Sayfa ${p}/${pages}</span><div class="flex-1"></div>
    <select id="pgSize" class="inp !w-auto !py-1">${[25,50,100].map(n=>`<option ${s.size===n?'selected':''}>${n}</option>`).join('')}</select>
    <button class="btn btn-ghost btn-sm" data-pg="${p-1}" ${p<=1?'disabled':''}>${icon('chevL','w-4 h-4')}</button>`;
  let last=0;for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-p)<=2){if(i-last>1)html+='<span class="px-1 text-slate-300">…</span>';html+=`<button class="btn btn-sm ${i===p?'btn-primary':'btn-ghost'}" data-pg="${i}">${i}</button>`;last=i;}}
  html+=`<button class="btn btn-ghost btn-sm" data-pg="${p+1}" ${p>=pages?'disabled':''}>${icon('chevR','w-4 h-4')}</button>`;
  pg.innerHTML=html;
  pg.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const v=+b.dataset.pg;if(v>=1&&v<=pages){s.page=v;loadRows(mod);}});
  $('#pgSize').onchange=e=>{s.size=+e.target.value;s.page=1;loadRows(mod);};
}
const recordLabel=(mod,r)=>r[mod.labelKey]||r.fisNo||r.unvan||r.adSoyad||('#'+r.id);

    if(act==='edit')openFormModal(mod,rec);
    else if(act==='docs')openDocs(mod,rec);
    else if(act==='custom'){mod.actions[b.dataset.fn](rec);}
    else if(act==='del'){if(await confirmDlg('"'+recordLabel(mod,rec)+'" kaydı kalıcı olarak silinecek. Emin misiniz?')){
      if(mod.onDelete)await mod.onDelete(rec);
      await db.table(mod.table).delete(id);
      await db.belgeler.where('[modul+kayitId]').equals([mod.id,id]).delete().catch(()=>{});
      if(['cariler','araclar','malzemeler','personel'].includes(mod.table))await refreshLookups();
      toast('Kayıt silindi');loadRows(mod);}}
  });
  if(mod.headerExtra)mod.headerExtra($('#modHeader'));
  await loadRows(mod);
}
async function exportCsv(mod,s){
  const rows=await db.table(mod.table).orderBy('id').reverse().limit(20000).toArray();
  const head=mod.columns.map(c=>c.label).join(';');
  const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent;};
  const lines=rows.map(r=>mod.columns.map(c=>String(strip(cellVal(c,r))).replace(/;/g,',')).join(';'));
  download(mod.id+'-export.csv','\ufeff'+head+'\n'+lines.join('\n'),'text/csv');
  toast('CSV dosyası indirildi ('+rows.length+' kayıt)');
}

function fieldHtml(f,val){
  const v=val??(f.def==='today'?todayISO():(f.def??''));
  const req=f.required?'required':'',ro=f.readonly?'readonly tabindex="-1"':'';
  const cls='inp'+(f.readonly?' !bg-slate-50 !text-slate-500':'');
  let input='';
  if(f.type==='textarea')input=`<textarea name="${f.name}" class="${cls}" rows="2">${esc(v)}</textarea>`;
  else if(f.type==='select')input=`<select name="${f.name}" class="${cls}" ${req}>${f.options.map(o=>`<option value="${o}" ${String(o)===String(v)?'selected':''}>${o}</option>`).join('')}</select>`;
  else if(f.type==='ref'){const opts=[...LK[f.table].values()].sort((a,b)=>rawLabel(f.table,a).localeCompare(rawLabel(f.table,b),'tr'));
    input=`<select name="${f.name}" class="${cls}" ${req} data-reftable="${f.table}" ${f.autoPrice?`data-autoprice="${f.autoPrice}"`:''}><option value="">Seçiniz...</option>${opts.map(o=>`<option value="${o.id}" ${o.id===v?'selected':''}>${esc(rawLabel(f.table,o))}</option>`).join('')}</select>`;}
  else if(f.type==='date')input=`<input type="date" name="${f.name}" class="${cls}" value="${v}" ${req} ${ro}>`;
  else if(f.type==='time')input=`<input type="time" name="${f.name}" class="${cls}" value="${v}" ${ro}>`;
  else if(f.type==='number')input=`<input type="number" step="any" name="${f.name}" class="${cls}" value="${v}" ${req} ${ro}>`;
  else if(f.type==='money')input=`<input type="number" step="0.01" min="0" name="${f.name}" class="${cls}" value="${v}" ${req} ${ro}>`;
  else if(f.type==='checkbox')input=`<label class="flex items-center gap-2 mt-2.5"><input type="checkbox" name="${f.name}" ${v?'checked':''} class="w-4 h-4 accent-blue-700"><span class="text-[13px] text-slate-600">${f.checkLabel||'Evet'}</span></label>`;
  else input=`<input type="text" name="${f.name}" class="${cls}" value="${esc(v)}" ${req} ${ro}>`;
  return `<div class="${f.full?'col-span-2':''}"><label class="lbl">${f.label}${f.required?' <span class="text-red-500">*</span>':''}</label>${input}</div>`;
}
function openFormModal(mod,rec=null,onSaved=null){
  const isEdit=!!rec,r=rec||{};
  const ov=openModal(`
    <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
      <h3 class="font-semibold text-slate-800 text-[15px]">${isEdit?'Kayıt Düzenle':'Yeni Kayıt'} — ${mod.title}</h3>
      <button class="btn-icon" data-close>${icon('x','w-5 h-5')}</button>
    </div>
    <form id="recForm" class="p-5 grid grid-cols-2 gap-x-4 gap-y-3.5 overflow-y-auto">${mod.fields.map(f=>fieldHtml(f,r[f.name])).join('')}</form>
    <div class="px-5 py-4 border-t border-slate-200 flex justify-end gap-2 shrink-0">
      <button class="btn btn-ghost" data-close>Vazgeç</button>
      <button class="btn btn-primary" id="saveRec">${icon('check','w-4 h-4')} Kaydet</button>
    </div>`,{w:'720px'});
  const form=ov.querySelector('#recForm');
  form.addEventListener('input',()=>{if(mod.onFormInput)mod.onFormInput(form.elements);});
  form.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.autoprice){const row=LK[t.dataset.reftable].get(+t.value);if(row&&row.birimFiyat!=null){form.elements[t.dataset.autoprice].value=row.birimFiyat;form.dispatchEvent(new Event('input'));}}});
  if(mod.onFormInput)mod.onFormInput(form.elements);
  ov.querySelector('#saveRec').onclick=async()=>{
    if(!form.reportValidity())return;
    const out=isEdit?{...rec}:{};
    mod.fields.forEach(f=>{const e=form.elements[f.name];if(!e)return;
      if(f.readonly&&f.computed)return;
      if(f.type==='checkbox')out[f.name]=e.checked;
      else if(f.type==='number'||f.type==='money')out[f.name]=parseFloat(e.value)||0;
      else if(f.type==='ref')out[f.name]=e.value?+e.value:null;
      else out[f.name]=e.value;});
    if(mod.beforeSave)await mod.beforeSave(out,isEdit);
    if(!isEdit&&mod.noPrefix)out[mod.noField||'no']=await nextNo(mod.noPrefix);
    let id;
    if(isEdit){out.id=rec.id;await db.table(mod.table).put(out);id=rec.id;}
    else id=await db.table(mod.table).add(out);
    if(mod.afterSave)await mod.afterSave(out,id,isEdit);
    if(['cariler','araclar','malzemeler','personel'].includes(mod.table))await refreshLookups();
    toast('Kayıt başarıyla kaydedildi');closeModal(ov);
    if(onSaved)onSaved();else reloadCurrent();
  };
}

    dl.querySelectorAll('[data-dact]').forEach(b=>b.onclick=async()=>{
      const id=+b.closest('[data-id]').dataset.id;
      const d=await db.belgeler.get(id);if(!d)return;
      const act=b.dataset.dact;
      if(act==='view'){const url=URL.createObjectURL(d.data);const isImg=(d.mime||'').startsWith('image');
        openModal(`<div class="px-4 py-3 border-b border-slate-200 flex justify-between items-center"><span class="font-medium text-sm text-slate-700 truncate">${esc(d.ad)}</span><button class="btn-icon" data-close>${icon('x','w-5 h-5')}</button></div>
        <div class="p-2 bg-slate-100 overflow-auto">${isImg?`<img src="${url}" class="max-h-[75vh] mx-auto">`:`<iframe src="${url}" class="w-full bg-white rounded" style="height:75vh"></iframe>`}</div>`,{w:'920px'});}
      else if(act==='open'){const url=URL.createObjectURL(d.data);window.open(url,'_blank');}
      else if(act==='dl'){const url=URL.createObjectURL(d.data);const a=document.createElement('a');a.href=url;a.download=d.ad;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);}
      else if(act==='del'){if(await confirmDlg('"'+d.ad+'" belgesi silinecek. Emin misiniz?')){await db.belgeler.delete(id);toast('Belge silindi');load();}}
    });
  };

    for(const file of e.target.files){

      await db.belgeler.add({modul:mod.id,kayitId:rec.id,ad:file.name,boyut:file.size,mime:file.type||'application/octet-stream',tarih:todayISO(),data:file});
    }
    e.target.value='';toast('Belge yüklendi');load();
  });
  await load();
}

async function renderKdv(){

      <div><label class="lbl">Yıl</label><select id="kdvYil" class="inp !w-28">${[cy-2,cy-1,cy,cy+1].map(y=>`<option ${y===cy?'selected':''}>${y}</option>`).join('')}</select></div>
      <button class="btn btn-primary" id="kdvHesap">${icon('check','w-4 h-4')} Hesapla</button>
    </div>

      <div class="px-4 py-3 border-b border-slate-200 text-[13px] font-semibold text-slate-700">Kaydedilen KDV Dönemleri</div>
      <div id="kdvSaved"></div>
    </div></div>`;
  const hesapla=async()=>{
    const ym=$('#kdvYil').value+'-'+$('#kdvAy').value;
    let hesaplanan=0,indirilecek=0;const rows=[];
    await db.fatura.where('tarih').startsWith(ym).each(f=>{if(f.tip==='Satış')hesaplanan+=f.kdvTutar||0;else indirilecek+=f.kdvTutar||0;rows.push(f);});
    hesaplanan=round2(hesaplanan);indirilecek=round2(indirilecek);

    rows.sort((a,b)=>a.tarih<b.tarih?-1:1);
    $('#kdvOut').innerHTML=`
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        ${kpi('Hesaplanan KDV (Satış)',fmtMoney(hesaplanan),'','text-blue-700')}
        ${kpi('İndirilecek KDV (Alış)',fmtMoney(indirilecek),'','text-slate-900')}
        ${kpi('Ödenecek KDV',fmtMoney(Math.max(0,fark)),'','text-red-600')}
        ${kpi('Devreden KDV',fmtMoney(Math.max(0,-fark)),'','text-emerald-600')}
      </div>
      <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
          <span class="text-[13px] font-semibold text-slate-700">${AYLAR[+ym.slice(5,7)-1]} ${ym.slice(0,4)} — Fatura KDV Dökümü (${rows.length} fatura)</span>
          <button class="btn btn-ghost btn-sm" id="kdvKaydet">${icon('save','w-4 h-4')} Dönemi Arşivle</button>
        </div>
        <div class="overflow-auto" style="max-height:320px"><table class="tbl"><thead><tr><th>Fatura No</th><th>Tarih</th><th>Cari</th><th>Tip</th><th class="tr">Matrah</th><th class="tr">KDV Oranı</th><th class="tr">KDV Tutarı</th></tr></thead>
        <tbody>${rows.map(f=>`<tr class="border-t border-slate-100"><td>${esc(f.faturaNo)}</td><td>${fmtDate(f.tarih)}</td><td>${lkLabel('cariler',f.cariId)}</td><td>${badge(f.tip)}</td><td class="tr">${fmtMoney(f.araToplam)}</td><td class="tr">%${f.kdvOrani}</td><td class="tr font-medium">${fmtMoney(f.kdvTutar)}</td></tr>`).join('')||'<tr><td colspan="7" class="text-center py-6 text-slate-400">Bu dönemde fatura yok</td></tr>'}</tbody></table></div>
      </div>`;
    $('#kdvKaydet').onclick=async()=>{
      await db.kdvKayit.add({ym,donem:AYLAR[+ym.slice(5,7)-1]+' '+ym.slice(0,4),hesaplanan,indirilecek,odenecek:Math.max(0,fark),devreden:Math.max(0,-fark),kayitTarihi:todayISO()});
      toast('KDV dönemi arşivlendi');loadSaved();
    };
  };

    const ks=await db.kdvKayit.orderBy('id').reverse().toArray();
    $('#kdvSaved').innerHTML=`<table class="tbl"><thead><tr><th>Dönem</th><th class="tr">Hesaplanan</th><th class="tr">İndirilecek</th><th class="tr">Ödenecek</th><th class="tr">Devreden</th><th>Kayıt Tarihi</th><th class="tr" style="width:50px"></th></tr></thead>
      <tbody>${ks.map(k=>`<tr class="border-t border-slate-100"><td class="font-medium">${esc(k.donem)}</td><td class="tr">${fmtMoney(k.hesaplanan)}</td><td class="tr">${fmtMoney(k.indirilecek)}</td><td class="tr text-red-600 font-medium">${fmtMoney(k.odenecek)}</td><td class="tr text-emerald-600">${fmtMoney(k.devreden)}</td><td>${fmtDate(k.kayitTarihi)}</td>
      <td class="tr"><button class="btn-icon hover:!text-red-600" data-kdel="${k.id}">${icon('trash','w-4 h-4')}</button></td></tr>`).join('')||'<tr><td colspan="7" class="text-center py-6 text-slate-400">Arşivlenmiş dönem yok</td></tr>'}</tbody></table>`;

  };
  $('#kdvHesap').onclick=hesapla;
  await hesapla();await loadSaved();
}

// ---------- 18. YAPAY ZEKA ----------
async function aiAnswer(q){
  const t=q.toLowerCase();const ym=todayISO().slice(0,7),ymP=monthKey(1);
  const has=(...ws)=>ws.some(w=>t.includes(w));
  if(has('kasa','bakiye','nakit')){const b=await kasaBakiye();const g=await aggMonth('kasa',ym,'tutar',r=>r.tip==='Giriş');const c=await aggMonth('kasa',ym,'tutar',r=>r.tip==='Çıkış');
    return `Güncel kasa bakiyesi <b>${fmtMoney(b.b)}</b>.<br>Bu ay: <b class="text-emerald-600">+${fmtMoney(g.s)}</b> giriş, <b class="text-red-600">−${fmtMoney(c.s)}</b> çıkış (${g.c+c.c} işlem).`;}
  if(has('vade','gecik','geçik')){const today=todayISO();let n=0,tut=0;const list=[];
    await db.fatura.each(f=>{if(f.durum!=='Ödendi'&&f.vadeTarihi&&f.vadeTarihi<today){n++;tut+=f.genelToplam||0;list.push(f);}});
    list.sort((a,b)=>b.genelToplam-a.genelToplam);
    if(!n)return 'Vadesi geçmiş fatura bulunmuyor. Tahsilat durumu iyi görünüyor.';
    return `<b>${n} adet</b> vadesi geçmiş fatura var, toplam <b class="text-red-600">${fmtMoney(tut)}</b>.<br>En yüksek 3:<br>${list.slice(0,3).map(f=>'• '+esc(f.faturaNo)+' — '+esc(rawLabel('cariler',LK.cariler.get(f.cariId)))+': <b>'+fmtMoney(f.genelToplam)+'</b>').join('<br>')}<br>Tahsilat önceliklendirmesi önerilir.`;}
  if(has('satış','satis','ciro','gelir')){const a=await aggMonth('fatura',ym,'genelToplam',r=>r.tip==='Satış');const p=await aggMonth('fatura',ymP,'genelToplam',r=>r.tip==='Satış');
    const deg=p.s?round1((a.s-p.s)/p.s*100):0;
    return `Bu ay satış: <b>${fmtMoney(a.s)}</b> (${a.c} fatura).<br>Geçen ay: <b>${fmtMoney(p.s)}</b> (${p.c} fatura).<br>Değişim: <b class="${deg>=0?'text-emerald-600':'text-red-600'}">%${Math.abs(deg)} ${deg>=0?'artış':'azalış'}</b>.`;}
  if(has('yakıt','yakit','mazot','akaryakıt')){const l=await aggMonth('yakit',ym,'litre');const t2=await aggMonth('yakit',ym,'tutar');
    const map={};await db.yakit.where('tarih').startsWith(ym).each(r=>{map[r.aracId]=(map[r.aracId]||0)+(r.tutar||0);});
    const top=Object.entries(map).sort((a,b)=>b[1]-a[1])[0];
    return `Bu ay yakıt: <b>${fmtNum(round1(l.s))} litre</b>, toplam <b>${fmtMoney(t2.s)}</b> (${t2.c} ikmal).${top?'<br>En yüksek tüketim: <b>'+esc(rawLabel('araclar',LK.araclar.get(+top[0])))+'</b> — '+fmtMoney(top[1])+'.':''}`;}
  if(has('üretim','uretim','tonaj','tesis')){const u=await aggMonth('tesis',ym,'uretimTon');const up=await aggMonth('tesis',ymP,'uretimTon');
    let best={uretimTon:0,tarih:''};await db.tesis.where('tarih').startsWith(ym).each(r=>{if((r.uretimTon||0)>best.uretimTon)best=r;});
    return `Bu ay üretim: <b>${fmtNum(u.s)} ton</b> (${u.c} gün, günlük ort. <b>${fmtNum(round1(u.c?u.s/u.c:0))} ton</b>).<br>Geçen ay: ${fmtNum(up.s)} ton.${best.tarih?'<br>En verimli gün: <b>'+fmtDate(best.tarih)+'</b> — '+fmtNum(best.uretimTon)+' ton.':''}`;}
  if(has('müşteri','musteri','cari','borç','borc','alacak')){const map={};
    await db.fatura.each(f=>{if(f.tip==='Satış')map[f.cariId]=(map[f.cariId]||0)+(f.genelToplam||0);});
    const top=Object.entries(map).sort((a,b)=>b[1]-a[1])[0];
    let borclu=0,adet=0;await db.cariler.each(c=>{if((c.bakiye||0)>0){borclu+=c.bakiye;adet++;}});
    return `${top?'Ciro lideri: <b>'+esc(rawLabel('cariler',LK.cariler.get(+top[0])))+'</b> — toplam '+fmtMoney(top[1])+'.<br>':''}Borçlu cari: <b>${adet} adet</b>, toplam alacak <b class="text-red-600">${fmtMoney(borclu)}</b>.`;}
  if(has('personel','maaş','maas','mesai','işçi','isci')){const ps=await db.personel.toArray();const akt=ps.filter(p=>p.durum==='Aktif');
    const maas=akt.reduce((a,p)=>a+(p.maas||0),0);const m=await aggMonth('mesai',ym,'toplam');
    return `Aktif personel: <b>${akt.length} kişi</b> (toplam ${ps.length} kayıtlı).<br>Aylık maaş yükü: <b>${fmtMoney(maas)}</b>.<br>Bu ay fazla mesai ödemesi: <b>${fmtMoney(m.s)}</b> (${m.c} kayıt).`;}
  if(has('kdv','vergi')){let h=0,i=0;await db.fatura.where('tarih').startsWith(ym).each(f=>{if(f.tip==='Satış')h+=f.kdvTutar||0;else i+=f.kdvTutar||0;});
    return `Bu ay KDV durumu:<br>Hesaplanan (satış): <b>${fmtMoney(h)}</b><br>İndirilecek (alış): <b>${fmtMoney(i)}</b><br>Tahmini ödenecek: <b class="text-red-600">${fmtMoney(Math.max(0,h-i))}</b>`;}
  if(has('özet','ozet','rapor','genel','durum')){const b=await kasaBakiye();const a=await aggMonth('fatura',ym,'genelToplam',r=>r.tip==='Satış');const u=await aggMonth('tesis',ym,'uretimTon');const y=await aggMonth('yakit',ym,'tutar');
    return `<b>${AYLAR[+ym.slice(5,7)-1]} ${ym.slice(0,4)} Genel Özet</b><br>• Satış: <b>${fmtMoney(a.s)}</b><br>• Üretim: <b>${fmtNum(u.s)} ton</b><br>• Yakıt gideri: <b>${fmtMoney(y.s)}</b><br>• Kasa bakiyesi: <b>${fmtMoney(b.b)}</b>`;}
  if(has('merhaba','selam','günaydın','gunaydin','iyi'))return 'Merhaba! Size nasıl yardımcı olabilirim? Kasa, satış, üretim, yakıt, cari veya personel hakkında sorabilirsiniz.';
  return 'Şu konularda analiz yapabilirim:<br>• <b>Kasa bakiyesi</b> ve nakit akışı<br>• <b>Satış / ciro</b> analizi ve trend<br>• <b>Vadesi geçen faturalar</b><br>• <b>Yakıt tüketimi</b> ve maliyeti<br>• <b>Üretim</b> performansı<br>• <b>Cari</b> borç/alacak durumu<br>• <b>Personel</b> maaş ve mesai<br>• <b>KDV</b> tahmini<br>Örnek: "Bu ay satışlar nasıl?"';
}
async function renderAI(){
  const main=$('#main');
  main.innerHTML=`<div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-4" style="min-height:calc(100vh - 80px)">
    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-lg flex flex-col overflow-hidden">

      </div>
      <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50" style="min-height:300px"></div>

      </div>
    </div>
    <div class="space-y-3 overflow-y-auto">
      <div class="flex items-center justify-between"><h3 class="text-[13px] font-semibold text-slate-700">Otomatik Analizler</h3><button id="aiRefresh" class="btn btn-ghost btn-sm no-print">${icon('refresh','w-3.5 h-3.5')} Yenile</button></div>
      <div id="insights" class="space-y-3"></div>
    </div></div>`;
  const chat=$('#chat');
  const addMsg=(role,html)=>{const d=document.createElement('div');d.className='flex '+(role==='u'?'justify-end':'');d.innerHTML=`<div class="${role==='u'?'msg-u':'msg-a'}">${html}</div>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;};

  const chips=['Kasa bakiyesi','Bu ay satışlar','Vadesi geçen faturalar','Yakıt analizi','Üretim özeti','En iyi müşteri','Personel maliyeti','Genel özet'];
  $('#chips').innerHTML=chips.map(c=>`<button type="button" class="chip">${c}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent));
  $('#aiForm').onsubmit=e=>{e.preventDefault();const v=$('#aiIn').value.trim();if(!v)return;$('#aiIn').value='';ask(v);};
  addMsg('a','Merhaba! Ben <b>Avcıbey AI Asistan</b>. Kasa, satış, yakıt, üretim, cari ve personel verilerinizi gerçek zamanlı analiz edebilirim. Aşağıdaki örnek sorularla başlayabilirsiniz.');
  const loadInsights=async()=>{
    const out=$('#insights');out.innerHTML='<div class="text-center text-slate-400 text-[12px] py-6">Analiz ediliyor...</div>';
    const ym=todayISO().slice(0,7),ymP=monthKey(1),today=todayISO();
    const kb=await kasaBakiye();
    const a=await aggMonth('fatura',ym,'genelToplam',r=>r.tip==='Satış'),p=await aggMonth('fatura',ymP,'genelToplam',r=>r.tip==='Satış');
    const deg=p.s?round1((a.s-p.s)/p.s*100):0;
    let ovN=0,ovT=0;await db.fatura.each(f=>{if(f.durum!=='Ödendi'&&f.vadeTarihi&&f.vadeTarihi<today){ovN++;ovT+=f.genelToplam||0;}});
    const m30=addDaysISO(today,-30),mm={};await db.kantar.where('tarih').aboveOrEqual(m30).each(r=>{mm[r.malzemeId]=(mm[r.malzemeId]||0)+(r.net||0)/1000;});
    const topM=Object.entries(mm).sort((x,y)=>y[1]-x[1])[0];
    const yk=await aggMonth('yakit',ym,'tutar');
    const ur=await aggMonth('tesis',ym,'uretimTon'),urp=await aggMonth('tesis',ymP,'uretimTon');
    const ins=(title,body,tone)=>`<div class="ins" style="border-left-color:${tone}"><div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-1">${title}</div><div class="text-[13px] text-slate-700 leading-relaxed">${body}</div></div>`;
    out.innerHTML=
      ins('Nakit Durumu',`Kasa bakiyesi <b>${fmtMoney(kb.b)}</b>. ${kb.b<0?'<span class="text-red-600 font-medium">Nakit açığı var, tahsilatları hızlandırın.</span>':'Nakit pozisyonu '+(kb.b>100000?'güçlü.':'sınırlı, harcamalarda dikkatli olun.')}`,kb.b<0?'#dc2626':'#059669')+
      ins('Satış Trendi',`Bu ay <b>${fmtMoney(a.s)}</b> satış. Geçen aya göre <b class="${deg>=0?'text-emerald-600':'text-red-600'}">%${Math.abs(deg)} ${deg>=0?'artış':'azalış'}</b>.`,deg>=0?'#059669':'#d97706')+
      (ovN?ins('Vade Uyarısı',`<b class="text-red-600">${ovN} fatura</b> vadesi geçmiş durumda, toplam <b>${fmtMoney(ovT)}</b>. Tahsilat planı önerilir.`,'#dc2626'):ins('Vade Durumu','Vadesi geçmiş fatura bulunmuyor.','#059669'))+
      (topM?ins('Öne Çıkan Malzeme',`Son 30 günde en çok <b>${esc(rawLabel('malzemeler',LK.malzemeler.get(+topM[0])))}</b> sevk edildi: <b>${fmtNum(round1(topM[1]))} ton</b>.`,'#1e40af'):'')+
      ins('Yakıt Maliyeti',`Bu ay yakıt gideri <b>${fmtMoney(yk.s)}</b>. Birim maliyet kontrolü için Yakıt modülünü inceleyin.`,'#d97706')+
      ins('Üretim Performansı',`Bu ay <b>${fmtNum(ur.s)} ton</b> üretim (günlük ort. ${fmtNum(round1(ur.c?ur.s/ur.c:0))} ton). Geçen ay: ${fmtNum(urp.s)} ton.`,'#1e40af');
  };
  $('#aiRefresh').onclick=loadInsights;
  await loadInsights();
}

        <tbody>${rows.map(r=>`<tr class="border-t border-slate-100" data-id="${r.id}"><td class="font-medium">${esc(r.plaka)}</td><td>${esc(r.tip||'')}</td><td>${esc(r.marka||'')}</td><td>${r.yil||'—'}</td><td>${badge(r.durum||'Aktif')}</td>
        <td class="tr"><button class="btn-icon" data-e>${icon('pencil','w-4 h-4')}</button><button class="btn-icon hover:!text-red-600" data-d>${icon('trash','w-4 h-4')}</button></td></tr>`).join('')}</tbody></table></div>`;
      $('#addArac').onclick=()=>openFormModal(MOD_ARAC,null,()=>{refreshLookups();tabs[1]();});
      tc.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const r=await db.araclar.get(+b.closest('tr').dataset.id);openFormModal(MOD_ARAC,r,()=>{refreshLookups();tabs[1]();});});
      tc.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const id=+b.closest('tr').dataset.id;if(await confirmDlg('Araç silinecek. Emin misiniz?')){await db.araclar.delete(id);await refreshLookups();toast('Araç silindi');tabs[1]();}});},
    async()=>{const rows=await db.malzemeler.toArray();
      tc.innerHTML=`<div class="bg-white border border-slate-200 rounded-lg overflow-hidden max-w-3xl">
        <div class="px-4 py-3 border-b border-slate-200 flex justify-between items-center"><span class="text-[13px] font-semibold text-slate-700">Malzeme / Ürün Listesi (${rows.length})</span><button class="btn btn-primary btn-sm" id="addMalz">${icon('plus','w-4 h-4')} Yeni Malzeme</button></div>
        <table class="tbl"><thead><tr><th>Malzeme Adı</th><th>Birim</th><th class="tr">Birim Fiyat</th><th class="tr" style="width:90px"></th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="border-t border-slate-100" data-id="${r.id}"><td class="font-medium">${esc(r.ad)}</td><td>${esc(r.birim||'')}</td><td class="tr">${fmtMoney(r.birimFiyat)}</td>
        <td class="tr"><button class="btn-icon" data-e>${icon('pencil','w-4 h-4')}</button><button class="btn-icon hover:!text-red-600" data-d>${icon('trash','w-4 h-4')}</button></td></tr>`).join('')}</tbody></table></div>`;
      $('#addMalz').onclick=()=>openFormModal(MOD_MALZ,null,()=>{refreshLookups();tabs[2]();});
      tc.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const r=await db.malzemeler.get(+b.closest('tr').dataset.id);openFormModal(MOD_MALZ,r,()=>{refreshLookups();tabs[2]();});});
      tc.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const id=+b.closest('tr').dataset.id;if(await confirmDlg('Malzeme silinecek. Emin misiniz?')){await db.malzemeler.delete(id);await refreshLookups();toast('Malzeme silindi');tabs[2]();}});},
    async()=>{
      const counts=await Promise.all(db.tables.map(async t=>({n:t.name,c:await t.count()})));
      tc.innerHTML=`<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 max-w-5xl">
        <div class="bg-white border border-slate-200 rounded-lg p-5">
          <div class="text-[13px] font-semibold text-slate-700 mb-1">Yedekleme</div>
          <p class="text-[12px] text-slate-400 mb-4">Tüm veriler (belgeler dahil) tek JSON dosyası olarak dışa aktarılır. Düzenli aralıklarla yedek almanız önerilir.</p>
          <div class="flex gap-2">
            <button class="btn btn-primary" id="expBtn">${icon('download','w-4 h-4')} Tam Yedek İndir (JSON)</button>
            <label class="btn btn-ghost cursor-pointer">${icon('upload','w-4 h-4')} Yedekten Geri Yükle<input type="file" id="impFile" class="hidden" accept=".json"></label>
          </div>
          <div class="mt-5 text-[12px] text-slate-500"><div class="font-semibold text-slate-600 mb-2">Kayıt Sayıları</div>
          <div class="grid grid-cols-2 gap-x-6 gap-y-1">${counts.map(x=>`<div class="flex justify-between border-b border-slate-100 py-1"><span>${x.n}</span><b>${fmtNum(x.c)}</b></div>`).join('')}</div></div>
        </div>
        <div class="bg-white border border-red-200 rounded-lg p-5">
          <div class="text-[13px] font-semibold text-red-700 mb-1">Tehlikeli Bölge</div>
          <p class="text-[12px] text-slate-400 mb-4">Bu işlemler geri alınamaz. Devam etmeden önce yedek aldığınızdan emin olun.</p>
          <div class="flex flex-col gap-2">
            <button class="btn btn-ghost" id="reseedBtn">${icon('refresh','w-4 h-4')} Örnek Verileri Yeniden Yükle</button>
            <button class="btn btn-danger" id="clearBtn">${icon('alert','w-4 h-4')} Tüm Verileri Kalıcı Olarak Sil</button>
          </div>
        </div></div>`;
      $('#expBtn').onclick=exportBackup;
      $('#impFile').addEventListener('change',async e=>{if(e.target.files[0]){try{await importBackup(e.target.files[0]);}catch(err){toast('Hata: '+err,'error');}e.target.value='';}});
      $('#clearBtn').onclick=async()=>{if(await confirmDlg('TÜM VERİLER kalıcı olarak silinecek! Devam edilsin mi?')){if(await confirmDlg('Son onay: Bu işlem geri alınamaz. Emin misiniz?')){for(const t of db.tables)await t.clear();await refreshLookups();toast('Tüm veriler silindi');navigate('dashboard');}}};
      $('#reseedBtn').onclick=async()=>{if(await confirmDlg('Mevcut veriler silinip örnek veriler yüklenecek. Onaylıyor musunuz?')){for(const t of db.tables)await t.clear();await seedIfEmpty();await refreshLookups();toast('Örnek veriler yüklendi');navigate('dashboard');}};}
  ];
  main.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{main.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tabs[+b.dataset.tab]();});
  await tabs[0]();
}
async function exportBackup(){
  toast('Yedek hazırlanıyor...','info');
  const data={_meta:{app:'AvcibeyERP',v:1,tarih:new Date().toISOString()}};
  for(const t of db.tables){const rows=await t.toArray();
    if(t.name==='belgeler')for(const r of rows)r.data=await blobToDataURL(r.data);
    data[t.name]=rows;}
  const d=new Date();
  download('avcibey-erp-yedek-'+toISO(d).replace(/-/g,'')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json',JSON.stringify(data),'application/json');
  toast('Yedek dosyası indirildi');
}
async function importBackup(file){
  const data=JSON.parse(await file.text());
  if(!data._meta||data._meta.app!!=='AvcibeyERP')throw 'Geçersiz yedek dosyası';
  if(!await confirmDlg('Mevcut tüm veriler silinip yedek yüklenecek. Onaylıyor musunuz?'))return;
  for(const t of db.tables)await t.clear();
  for(const t of db.tables){const rows=data[t.name];if(!rows||!rows.length)continue;
    if(t.name==='belgeler')for(const r of rows)r.data=await dataURLtoBlob(r.data);
    await t.bulkAdd(rows);}
  await refreshLookups();toast('Yedek başarıyla geri yüklendi');navigate('dashboard');
}

// ---------- 20. ROUTER & INIT ----------
const SPECIAL={dashboard:renderDashboard,kdv:renderKdv,raporlar:renderRaporlar,yapayzeka:renderAI,ayarlar:renderAyarlar};
function navigate(id){
  cur=id;curMod=null;
  dashCharts.forEach(c=>{try{c.destroy();}catch(e){}});dashCharts=[];
  if(repChart){try{repChart.destroy();}catch(e){}repChart=null;}
  document.querySelectorAll('#menu .mi').forEach(m=>m.classList.toggle('active',m.dataset.id===id));
  const item=MENU.find(m=>m.id===id);
  $('#pageTitle').textContent=item?item.label:'';
  const mod=MODULES[id];
  if(mod)renderGeneric(mod);else if(SPECIAL[id])SPECIAL[id]();
}
function buildSidebar(){
  $('#menu').innerHTML=MENU.map(m=>`<a class="mi" data-id="${m.id}">${icon(m.icon)}<span class="truncate">${m.label}</span></a>`).join('');
  $('#menu').addEventListener('click',e=>{const m=e.target.closest('.mi');if(m)navigate(m.dataset.id);});
}
(async function init(){
  buildSidebar();
  const d=new Date();
  $('#topDate').textContent=GUNLER[d.getDay()]+', '+fmtDate(todayISO());
  $('#quickBackup').onclick=exportBackup;
  $('#main').innerHTML='<div class="p-10 text-center text-slate-400 text-sm">Veritabanı hazırlanıyor...</div>';
  await db.open();
  await seedIfEmpty();
  await refreshLookups();
  navigate('dashboard');
})();
</script>
